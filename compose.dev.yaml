# Throwaway Authentik stack for local development of the OIDC login
# (ADR-0032). Started/stopped via `make oidc` / `make oidc-stop` — do not
# `docker compose down -v` unless you want to wipe the provider config:
# the named volume keeps the provisioned dkb-analytics client across
# restarts. This is dev tooling only; production images use the plain
# Dockerfile (no compose file ships with releases).
#
# Login for the app flow: user `akadmin`, password `dev-only-not-secret`.
# Admin UI: http://localhost:8081/if/admin/

name: dkb-analytics-dev-oidc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: dev-only-not-secret
    volumes:
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: dev-only-not-secret
      AUTHENTIK_SECRET_KEY: dev-only-not-secret-please-change-0123456789
      AUTHENTIK_BOOTSTRAP_PASSWORD: dev-only-not-secret
      AUTHENTIK_BOOTSTRAP_TOKEN: dev-bootstrap-token
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: warning
    ports:
      - "8081:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless image: no wget/curl — use the bundled python
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/-/health/ready/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: dev-only-not-secret
      AUTHENTIK_SECRET_KEY: dev-only-not-secret-please-change-0123456789
      AUTHENTIK_BOOTSTRAP_PASSWORD: dev-only-not-secret
      AUTHENTIK_BOOTSTRAP_TOKEN: dev-bootstrap-token
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: warning
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  authentik-db:
