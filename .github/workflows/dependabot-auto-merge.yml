name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'j-stechmann/dkb-csv-export-analysis'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Defense in depth: never merge majors, even if one slips past the
      # allow/ignore rules in dependabot.yml (e.g. docker tag edge cases)
      - name: Check for major version updates
        id: gate
        run: |
          if [[ "${{ steps.metadata.outputs.update-type }}" == *major* ]]; then
            echo "Major version update detected: ${{ steps.metadata.outputs.update-type }} - auto-merge blocked"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Branch protection now requires the "ci" check on develop, but this
      # workflow still explicitly watches the CI run before enabling
      # auto-merge: with --auto, GitHub then re-evaluates protection
      # atomically once the required check completes.
      - name: Wait for CI checks to pass
        if: steps.gate.outputs.skip == 'false'
        run: gh pr checks --watch --fail-fast --interval 30 "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.gate.outputs.skip == 'false'
        run: gh pr review --approve "$PR_URL" || echo "Already approved, continuing"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.gate.outputs.skip == 'false'
        # Merge commits, no branch deletion (delete_branch_on_merge is on)
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}